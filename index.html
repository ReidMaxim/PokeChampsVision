<!DOCTYPE html>
<html>
<head>

<title>Pokemon Champions OCR Logger MVP</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

body{
background:#111;
color:white;
font-family:Arial, sans-serif;
}

h1{
color:#ffcc00;
}

button{
padding:10px;
font-size:16px;
margin:5px;
}

video{
display:none;
}

canvas{
border:2px solid #555;
margin:5px;
}

.controls{
background:#222;
padding:15px;
width:500px;
}

label{
display:block;
margin:8px;
}

input{
width:300px;
}

#log,
#json{
background:#000;
height:250px;
overflow:auto;
padding:10px;
font-family:monospace;
}

.good{
color:#00ff99;
}

.warn{
color:#ffaa00;
}


</style>

</head>


<body>


<h1>Pokemon Champions OCR Logger</h1>


<button onclick="startOCR()">
Start Capture
</button>


<div class="controls">

<h3>ROI Controls</h3>


<label>
X
<input id="rx" type="range" min="0" max="960" value="150">
</label>


<label>
Y
<input id="ry" type="range" min="0" max="540" value="390">
</label>


<label>
Width
<input id="rw" type="range" min="100" max="960" value="650">
</label>


<label>
Height
<input id="rh" type="range" min="40" max="200" value="100">
</label>


</div>



<video id="video"
width="960"
height="540"
autoplay>
</video>


<h3>Camera Preview</h3>

<canvas id="preview"
width="960"
height="540">
</canvas>


<h3>OCR Crop</h3>

<canvas id="crop">
</canvas>



<h3>OCR Log</h3>

<div id="log"></div>


<h3>Events</h3>

<div id="json"></div>



<script>


const video =
document.getElementById("video");


const preview =
document.getElementById("preview");


const pctx =
preview.getContext("2d");


const cropCanvas =
document.getElementById("crop");


const log =
document.getElementById("log");


const json =
document.getElementById("json");



let worker;

let running=false;

let lastText="";

let lastTime=0;



function roi(){

return {

x:Number(rx.value),
y:Number(ry.value),
w:Number(rw.value),
h:Number(rh.value)

};

}



async function startOCR(){


if(running)
return;


running=true;


const stream =
await navigator.mediaDevices.getUserMedia({

video:{
width:1280,
height:720
}

});


video.srcObject=stream;



worker =
await Tesseract.createWorker(
"eng"
);



await worker.setParameters({

tessedit_pageseg_mode:"6",

preserve_interword_spaces:"1",

tessedit_char_whitelist:
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!?' "

});


scanLoop();


}



async function scanLoop(){


if(!running)
return;


pctx.drawImage(
video,
0,
0,
960,
540
);



drawROI();



const processed =
preprocess();


cropCanvas.width =
processed.width;


cropCanvas.height =
processed.height;


cropCanvas
.getContext("2d")
.drawImage(
processed,
0,
0
);



let result =
await worker.recognize(processed);



let text =
clean(
result.data.text
);


let confidence =
result.data.confidence;



if(
text.length>5 &&
confidence>60
){


if(
!similar(text,lastText)
){

lastText=text;

showOCR(
text,
confidence
);

parse(text);

}

}



setTimeout(
scanLoop,
1000
);


}





function drawROI(){


let r=roi();


pctx.strokeStyle="red";

pctx.lineWidth=3;


pctx.strokeRect(
r.x,
r.y,
r.w,
r.h
);


}




function preprocess(){


let r=roi();



let temp =
document.createElement("canvas");


temp.width=r.w;

temp.height=r.h;



let tctx =
temp.getContext("2d");



tctx.drawImage(

preview,

r.x,
r.y,
r.w,
r.h,

0,
0,
r.w,
r.h

);



let img =
tctx.getImageData(
0,
0,
r.w,
r.h
);



let d =
img.data;



for(
let i=0;
i<d.length;
i+=4
){


let gray =
(
d[i]*0.3+
d[i+1]*0.59+
d[i+2]*0.11
);



gray =
gray>135
?
255
:
0;



d[i]=gray;
d[i+1]=gray;
d[i+2]=gray;


}



tctx.putImageData(
img,
0,
0
);



let big =
document.createElement("canvas");


big.width =
r.w*4;


big.height =
r.h*4;



let bctx =
big.getContext("2d");


bctx.imageSmoothingEnabled=false;


bctx.drawImage(
temp,
0,
0,
big.width,
big.height
);



return big;


}




function clean(t){

return t

.replace(/\n/g," ")

.replace(/\s+/g," ")

.trim();

}




function similar(a,b){

if(!b)
return false;


return levenshtein(a,b)<3;

}




function levenshtein(a,b){


let matrix=[];


for(let i=0;i<=b.length;i++)
matrix[i]=[i];


for(let j=0;j<=a.length;j++)
matrix[0][j]=j;



for(let i=1;i<=b.length;i++){

for(let j=1;j<=a.length;j++){

matrix[i][j]=
b[i-1]==a[j-1]

?

matrix[i-1][j-1]

:

Math.min(

matrix[i-1][j-1]+1,

matrix[i][j-1]+1,

matrix[i-1][j]+1

);

}

}


return matrix[b.length][a.length];

}




function showOCR(
text,
confidence
){


log.innerHTML +=

`
<div class="good">
${confidence.toFixed(1)}%
<br>
${text}
</div>
<hr>
`;


log.scrollTop=
log.scrollHeight;


}





function parse(text){


let event=null;



let move =
text.match(
/(.+?) used (.+?)!/i
);



if(move){

event={

type:"move",

user:
move[1]
.replace("The opposing ",""),

move:
move[2]

};

}



if(
text.includes(
"super effective"
)
){

event={

type:"effect",

effect:
"super effective"

};

}



if(
text.includes(
"Not very effective"
)
){

event={

type:"effect",

effect:
"not very effective"

};

}



let hits =
text.match(
/hit (\d+) times/i
);


if(hits){

event={

type:"multi_hit",

hits:Number(hits[1])

};

}



if(
text.includes("defeated") ||
text.includes("fainted")
){

event={

type:"faint",

raw:text

};

}




if(event){


json.innerHTML +=

`
<pre class="warn">
${JSON.stringify(event,null,2)}
</pre>
`;


json.scrollTop=
json.scrollHeight;


console.log(event);


}



}



</script>


</body>
</html>
