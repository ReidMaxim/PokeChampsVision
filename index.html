<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Champions Live OCR Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/tesseract.js@v6.0.0/dist/tesseract.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
        }

        .video-container {
            position: relative;
            width: 100%;
            background-color: #1e293b;
            border: 2px solid #475569;
            border-radius: 0.5rem;
            overflow: hidden;
            min-height: 240px;
        }

        #videoPreview {
            width: 100%;
            height: auto;
            display: block;
            background-color: #000;
        }

        #cropCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .roi-box {
            position: absolute;
            border: 3px dashed #10b981;
            background-color: rgba(16, 185, 129, 0.1);
            pointer-events: none;
        }

        .battle-log {
            background-color: #1e293b;
            border: 2px solid #475569;
            border-radius: 0.5rem;
            padding: 1rem;
            height: 600px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .log-entry {
            margin-bottom: 0.5rem;
            color: #e2e8f0;
            word-wrap: break-word;
        }

        .log-entry.turn {
            color: #60a5fa;
            font-weight: bold;
        }

        .log-entry.action {
            color: #34d399;
        }

        .log-entry.status {
            color: #fbbf24;
        }

        .log-entry.damage {
            color: #f87171;
        }

        .btn-primary {
            background-color: #10b981;
            color: #1e293b;
            font-weight: bold;
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-primary:hover {
            background-color: #059669;
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            background-color: #6b7280;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background-color: #475569;
            color: #e2e8f0;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background-color: #64748b;
        }

        .toggle-btn {
            background-color: #475569;
            color: #e2e8f0;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            cursor: pointer;
            border: 2px solid #475569;
            transition: all 0.3s;
            font-weight: 600;
        }

        .toggle-btn.active {
            background-color: #10b981;
            border-color: #10b981;
            color: #1e293b;
        }

        .control-group {
            background-color: #1e293b;
            border: 1px solid #475569;
            border-radius: 0.375rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .control-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
        }

        select, input[type="range"] {
            background-color: #334155;
            color: #e2e8f0;
            border: 1px solid #475569;
            border-radius: 0.375rem;
            padding: 0.5rem;
            width: 100%;
            font-size: 0.875rem;
        }

        .status-indicator {
            display: inline-block;
            width: 0.75rem;
            height: 0.75rem;
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .status-indicator.inactive {
            background-color: #6b7280;
        }

        .status-indicator.active {
            background-color: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .info-box {
            background-color: #1e293b;
            border-left: 4px solid #10b981;
            padding: 1rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            color: #cbd5e1;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100">
    <div class="min-h-screen p-6">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-4xl font-bold text-emerald-400 mb-2">
                🎮 Pokémon Champions Clean OCR Tracker
            </h1>
            <p class="text-slate-400 text-sm">Automated stability-verified battle log generation</p>
        </div>

        <!-- Main Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- LEFT COLUMN: Video & Controls -->
            <div class="space-y-6">
                <!-- Device Configuration -->
                <div class="control-group">
                    <label class="control-label">📹 Video Input Device</label>
                    <select id="deviceSelect" class="mb-4">
                        <option value="">-- Select a device --</option>
                    </select>
                    <div class="flex gap-2">
                        <button id="startCaptureBtn" class="btn-primary flex-1">Start Capture</button>
                        <button id="stopCaptureBtn" class="btn-secondary flex-1" disabled>Stop Capture</button>
                    </div>
                </div>

                <!-- Video Preview -->
                <div class="video-container" id="videoContainer">
                    <video id="videoPreview" autoplay muted playsinline></video>
                    <canvas id="cropCanvas"></canvas>
                    <div id="roiBox" class="roi-box" style="display: none;"></div>
                </div>

                <!-- ROI Controls -->
                <div class="control-group">
                    <label class="control-label">🎯 Region of Interest (ROI)</label>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">X Offset</label>
                            <input type="range" id="roiX" min="0" max="100" value="0">
                            <span class="text-xs text-slate-500" id="roiXValue">0%</span>
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">Y Offset</label>
                            <input type="range" id="roiY" min="0" max="100" value="80">
                            <span class="text-xs text-slate-500" id="roiYValue">80%</span>
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">Width</label>
                            <input type="range" id="roiWidth" min="10" max="100" value="100">
                            <span class="text-xs text-slate-500" id="roiWidthValue">100%</span>
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">Height</label>
                            <input type="range" id="roiHeight" min="10" max="100" value="20">
                            <span class="text-xs text-slate-500" id="roiHeightValue">20%</span>
                        </div>
                    </div>
                    <button id="resetRoiBtn" class="btn-secondary w-full">Reset ROI</button>
                </div>
            </div>

            <!-- RIGHT COLUMN: Tracker Controls & Battle Log -->
            <div class="space-y-6">
                <!-- OCR Action Panel -->
                <div class="control-group">
                    <label class="control-label">⚙️ Stability OCR Engine</label>
                    <div id="ocrStatus" class="info-box mb-4">
                        <span class="status-indicator inactive"></span>
                        <span id="ocrStatusText">Ready to initialize</span>
                    </div>
                    <div class="flex gap-2">
                        <button id="startTrackerBtn" class="toggle-btn flex-1" disabled>
                            Start Auto-Tracker
                        </button>
                        <button id="stopTrackerBtn" class="toggle-btn flex-1" disabled style="display: none;">
                            Stop Auto-Tracker
                        </button>
                    </div>
                    <p class="text-xs text-slate-400 mt-3 text-center">Applies high-contrast filtering and duplicate verification to filter out animation noise.</p>
                </div>

                <!-- Battle Log Container -->
                <div>
                    <label class="control-label mb-2">🎯 Clean Battle Log</label>
                    <div id="battleLog" class="battle-log">
                        <div class="log-entry" style="color: #94a3b8;">
                            [System] Waiting for video input...
                        </div>
                    </div>
                </div>

                <!-- Log Controls -->
                <div class="flex gap-2">
                    <button id="copyLogBtn" class="btn-primary flex-1">📋 Copy Log</button>
                    <button id="clearLogBtn" class="btn-secondary flex-1">🗑️ Clear Log</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const state = {
            videoStream: null,
            tesseractWorker: null,
            isCapturing: false,
            isTracking: false,
            trackingInterval: null,
            lastRawText: '',
            consecutiveMatches: 0,
            committedText: '',
            logEntries: [],
            roi: { x: 0, y: 0.8, width: 1.0, height: 0.2 }
        };

        const elements = {
            deviceSelect: document.getElementById('deviceSelect'),
            videoPreview: document.getElementById('videoPreview'),
            cropCanvas: document.getElementById('cropCanvas'),
            roiBox: document.getElementById('roiBox'),
            startCaptureBtn: document.getElementById('startCaptureBtn'),
            stopCaptureBtn: document.getElementById('stopCaptureBtn'),
            startTrackerBtn: document.getElementById('startTrackerBtn'),
            stopTrackerBtn: document.getElementById('stopTrackerBtn'),
            battleLog: document.getElementById('battleLog'),
            copyLogBtn: document.getElementById('copyLogBtn'),
            clearLogBtn: document.getElementById('clearLogBtn'),
            roiX: document.getElementById('roiX'),
            roiY: document.getElementById('roiY'),
            roiWidth: document.getElementById('roiWidth'),
            roiHeight: document.getElementById('roiHeight'),
            roiXValue: document.getElementById('roiXValue'),
            roiYValue: document.getElementById('roiYValue'),
            roiWidthValue: document.getElementById('roiWidthValue'),
            roiHeightValue: document.getElementById('roiHeightValue'),
            resetRoiBtn: document.getElementById('resetRoiBtn'),
            ocrStatus: document.getElementById('ocrStatus'),
            ocrStatusText: document.getElementById('ocrStatusText')
        };

        async function initializeTesseract() {
            try {
                updateOcrStatus('Initializing Tesseract engine...', false);
                state.tesseractWorker = await Tesseract.createWorker('eng');
                
                await state.tesseractWorker.setParameters({
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.,!?-\' '
                });

                updateOcrStatus('✓ Tesseract ready (Stability Mode)', true);
                elements.startTrackerBtn.disabled = false;
                logMessage('[System] OCR engine initialized successfully', 'status');
            } catch (error) {
                console.error('Tesseract initialization failed:', error);
                updateOcrStatus('✗ Initialization failed', false);
                logMessage(`[Error] OCR init failed: ${error.message}`, 'damage');
            }
        }

        function updateOcrStatus(text, isActive) {
            elements.ocrStatusText.textContent = text;
            const indicator = elements.ocrStatus.querySelector('.status-indicator');
            if (isActive) {
                indicator.classList.remove('inactive');
                indicator.classList.add('active');
            } else {
                indicator.classList.remove('active');
                indicator.classList.add('inactive');
            }
        }

        async function enumerateDevices() {
            try {
                const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
                tempStream.getTracks().forEach(track => track.stop());

                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');

                elements.deviceSelect.innerHTML = '<option value="">-- Select a device --</option>';
                videoDevices.forEach(device => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.textContent = device.label || `Camera ${device.deviceId.substring(0, 5)}...`;
                    elements.deviceSelect.appendChild(option);
                });
                logMessage(`[System] Found ${videoDevices.length} video device(s)`, 'status');
            } catch (error) {
                logMessage(`[Error] Device error: ${error.message}`, 'damage');
            }
        }

        async function startCapture() {
            const deviceId = elements.deviceSelect.value;
            if (!deviceId) {
                logMessage('[Error] Please select a capture card device', 'damage');
                return;
            }

            try {
                state.videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { deviceId: { exact: deviceId } },
                    audio: false
                });

                elements.videoPreview.srcObject = state.videoStream;
                
                // Force play to ensure frames stream immediately
                await elements.videoPreview.play().catch(e => console.log("Auto-play prevented/handled:", e));

                state.isCapturing = true;
                elements.startCaptureBtn.disabled = true;
                elements.stopCaptureBtn.disabled = false;
                elements.deviceSelect.disabled = true;

                logMessage('[System] Video capture started', 'status');
                
                // Explicitly update canvas size once dimensions are active
                setTimeout(updateCanvasSize, 300);
            } catch (error) {
                logMessage(`[Error] Capture failed: ${error.message}`, 'damage');
            }
        }

        function stopCapture() {
            if (state.videoStream) {
                state.videoStream.getTracks().forEach(track => track.stop());
                state.videoStream = null;
            }
            stopTracking();
            state.isCapturing = false;
            elements.startCaptureBtn.disabled = false;
            elements.stopCaptureBtn.disabled = true;
            elements.deviceSelect.disabled = false;
            elements.videoPreview.srcObject = null;
            elements.roiBox.style.display = 'none';
            logMessage('[System] Video capture stopped', 'status');
        }

        function updateCanvasSize() {
            const container = document.getElementById('videoContainer');
            const rect = container.getBoundingClientRect();
            
            if (rect.width === 0) return;

            elements.cropCanvas.width = rect.width;
            elements.cropCanvas.height = elements.videoPreview.offsetHeight || rect.height;
            updateRoiBox();
        }

        function updateRoiBox() {
            const rect = elements.cropCanvas;
            if (rect.width === 0) return;

            const x = state.roi.x * rect.width;
            const y = state.roi.y * rect.height;
            const width = state.roi.width * rect.width;
            const height = state.roi.height * rect.height;

            elements.roiBox.style.left = x + 'px';
            elements.roiBox.style.top = y + 'px';
            elements.roiBox.style.width = width + 'px';
            elements.roiBox.style.height = height + 'px';
            elements.roiBox.style.display = 'block';

            const ctx = elements.cropCanvas.getContext('2d');
            ctx.clearRect(0, 0, rect.width, rect.height);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(0, 0, rect.width, rect.height);
            ctx.clearRect(x, y, width, height);
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 3;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(x, y, width, height);
            ctx.setLineDash([]);
        }

        async function processOcrTick() {
            if (!state.isCapturing || elements.videoPreview.readyState < 2) {
                return;
            }

            try {
                const tempCanvas = document.createElement('canvas');
                const videoWidth = elements.videoPreview.videoWidth;
                const videoHeight = elements.videoPreview.videoHeight;

                if (!videoWidth || !videoHeight) return;

                const roiX = state.roi.x * videoWidth;
                const roiY = state.roi.y * videoHeight;
                const roiWidth = state.roi.width * videoWidth;
                const roiHeight = state.roi.height * videoHeight;

                tempCanvas.width = roiWidth;
                tempCanvas.height = roiHeight;

                const ctx = tempCanvas.getContext('2d');
                ctx.drawImage(elements.videoPreview, roiX, roiY, roiWidth, roiHeight, 0, 0, roiWidth, roiHeight);

                let imgData = ctx.getImageData(0, 0, roiWidth, roiHeight);
                let data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                    let threshold = avg > 150 ? 255 : 0; 
                    data[i] = threshold;
                    data[i + 1] = threshold;
                    data[i + 2] = threshold;
                }
                ctx.putImageData(imgData, 0, 0);

                const result = await state.tesseractWorker.recognize(tempCanvas.toDataURL('image/png'));
                let rawText = result.data.text.trim();

                const validLines = rawText.split('\n')
                    .map(l => l.trim())
                    .filter(l => l.length >= 4 && /[a-zA-Z]{3,}/.test(l) && !/[|\\=_]{2,}/.test(l));

                if (validLines.length > 0) {
                    let currentSentence = validLines.join(' ');

                    if (currentSentence === state.lastRawText) {
                        state.consecutiveMatches++;
                        if (state.consecutiveMatches === 2 && currentSentence !== state.committedText) {
                            state.committedText = currentSentence;
                            logMessage(`[Action] ${currentSentence}`, 'action');
                        }
                    } else {
                        state.lastRawText = currentSentence;
                        state.consecutiveMatches = 1;
                    }
                }
            } catch (error) {
                console.error('OCR Tick error:', error);
            }
        }

        function startTracking() {
            if (!state.tesseractWorker || !state.isCapturing) return;
            state.isTracking = true;
            elements.startTrackerBtn.style.display = 'none';
            elements.stopTrackerBtn.style.display = 'block';
            elements.startTrackerBtn.disabled = true;
            elements.stopTrackerBtn.disabled = false;
            logMessage('[System] Auto-tracker started (1.0s interval)', 'status');

            state.trackingInterval = setInterval(processOcrTick, 1000);
        }

        function stopTracking() {
            if (state.trackingInterval) {
                clearInterval(state.trackingInterval);
                state.trackingInterval = null;
            }
            state.isTracking = false;
            elements.startTrackerBtn.style.display = 'block';
            elements.stopTrackerBtn.style.display = 'none';
            elements.startTrackerBtn.disabled = false;
            elements.stopTrackerBtn.disabled = true;
            logMessage('[System] Auto-tracker stopped', 'status');
        }

        function setupRoiControls() {
            ['X', 'Y', 'Width', 'Height'].forEach(param => {
                const lower = param.toLowerCase();
                elements[`roi${param}`].addEventListener('input', (e) => {
                    let val = e.target.value / 100;
                    if (param === 'Width' || param === 'Height') {
                        state.roi[lower] = Math.max(0.1, val);
                    } else {
                        state.roi[lower] = val;
                    }
                    elements[`roi${param}Value`].textContent = e.target.value + '%';
                    updateRoiBox();
                });
            });

            elements.resetRoiBtn.addEventListener('click', () => {
                state.roi = { x: 0, y: 0.8, width: 1.0, height: 0.2 };
                ['X', 'Y', 'Width', 'Height'].forEach(p => {
                    let def = p === 'Width' ? 100 : (p === 'Height' ? 20 : (p === 'Y' ? 80 : 0));
                    elements[`roi${p}`].value = def;
                    elements[`roi${p}Value`].textContent = def + '%';
                });
                updateRoiBox();
            });
        }

        function logMessage(message, type = 'action') {
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.textContent = message;
            elements.battleLog.appendChild(logEntry);
            elements.battleLog.scrollTop = elements.battleLog.scrollHeight;
            state.logEntries.push(message);
        }

        function setupEventListeners() {
            elements.startCaptureBtn.addEventListener('click', startCapture);
            elements.stopCaptureBtn.addEventListener('click', stopCapture);
            elements.startTrackerBtn.addEventListener('click', startTracking);
            elements.stopTrackerBtn.addEventListener('click', stopTracking);
            elements.copyLogBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(state.logEntries.join('\n'));
                logMessage('[System] Log copied to clipboard!', 'status');
            });
            elements.clearLogBtn.addEventListener('click', () => {
                elements.battleLog.innerHTML = '<div class="log-entry" style="color: #94a3b8;">[System] Log cleared</div>';
                state.logEntries = [];
                state.committedText = '';
            });
            window.addEventListener('resize', updateCanvasSize);
            elements.videoPreview.addEventListener('loadedmetadata', updateCanvasSize);
        }

        async function initialize() {
            setupEventListeners();
            setupRoiControls();
            await enumerateDevices();
            await initializeTesseract();
        }

        initialize();
    </script>
</body>
</html>
